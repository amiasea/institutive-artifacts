name: Build and Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/amiasea/institutive
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out release
        uses: actions/checkout@v7.0.1

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<number>."
            exit 1
          fi

      - name: Determine prerelease
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ -rc\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Restore

      - name: Restore API
        run: dotnet restore api/Amiasea.API.csproj

      - name: Restore Data Migrations
        run: dotnet restore data/Amiasea.Data.Migrations/Amiasea.Data.Migrations.csproj

      - name: Restore Functions
        run: dotnet restore functions/Amiasea.Functions.csproj

      - name: Restore Worker
        run: dotnet restore worker/Amiasea.Worker.csproj

      # Unit tests

      - name: Test API
        run: dotnet test api/Amiasea.API.csproj --no-restore

      - name: Test Data Migrations
        run: dotnet test data/Amiasea.Data.Migrations/Amiasea.Data.Migrations.csproj --no-restore

      - name: Test Functions
        run: dotnet test functions/Amiasea.Functions.csproj --no-restore

      - name: Test Worker
        run: dotnet test worker/Amiasea.Worker.csproj --no-restore

      # Publish

      - name: Publish API
        run: |
          dotnet publish api/Amiasea.API.csproj \
            --configuration Release \
            --no-restore \
            --output api/publish

      - name: Publish Data Migrations
        run: |
          dotnet publish data/Amiasea.Data.Migrations/Amiasea.Data.Migrations.csproj \
            --configuration Release \
            --no-restore \
            --output data/publish

      - name: Publish Functions
        run: |
          dotnet publish functions/Amiasea.Functions.csproj \
            --configuration Release \
            --no-restore \
            --output functions/publish

      - name: Publish Worker
        run: |
          dotnet publish worker/Amiasea.Worker.csproj \
            --configuration Release \
            --no-restore \
            --output worker/publish

      # GHCR

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Container images

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ env.RELEASE_TAG }}

      - name: Build and push Data image
        id: data
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./data
          file: ./data/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/data:${{ env.RELEASE_TAG }}

      - name: Build and push Webhook Adapter image
        id: webhook_adapter
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./functions
          file: ./functions/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/webhook-adapter:${{ env.RELEASE_TAG }}

      - name: Build and push Worker image
        id: worker
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:${{ env.RELEASE_TAG }}

      # Delivery contract
      #
      # There are five delivery roles but four physical images.
      # migrations_user_image intentionally uses the Data image.

      - name: Create delivery contract
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          DATA_DIGEST: ${{ steps.data.outputs.digest }}
          WEBHOOK_ADAPTER_DIGEST: ${{ steps.webhook_adapter.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail

          cat > app-artifacts-delivery-contract.json <<EOF
          {
            "api_image": "${IMAGE_PREFIX}/api@${API_DIGEST}",
            "data_migrations_image": "${IMAGE_PREFIX}/data@${DATA_DIGEST}",
            "webhook_adapter_image": "${IMAGE_PREFIX}/webhook-adapter@${WEBHOOK_ADAPTER_DIGEST}",
            "worker_image": "${IMAGE_PREFIX}/worker@${WORKER_DIGEST}",
            "migrations_user_image": "${IMAGE_PREFIX}/data@${DATA_DIGEST}"
          }
          EOF

      # GitHub Release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" \
              app-artifacts-delivery-contract.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              app-artifacts-delivery-contract.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi