name: Continuous Integration

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore api/Amiasea.API.csproj

      - name: Run API unit tests
        run: dotnet test api/Amiasea.API.csproj --no-restore

      - name: Build API container
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64

  data-migrations-tests:
    name: Data Migrations Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Data Migrations
        run: dotnet restore data/Amiasea.Data.Migrations/Amiasea.Data.Migrations.csproj

      - name: Run Data Migrations unit tests
        run: dotnet test data/Amiasea.Data.Migrations/Amiasea.Data.Migrations.csproj --no-restore

      - name: Build Data container
        uses: docker/build-push-action@v7
        with:
          context: ./data
          file: ./data/Dockerfile
          platforms: linux/amd64

  webhook-adapter-tests:
    name: Webhook Adapter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Webhook Adapter
        run: dotnet restore functions/Amiasea.Functions.csproj

      - name: Run Webhook Adapter unit tests
        run: dotnet test functions/Amiasea.Functions.csproj --no-restore

      - name: Build Webhook Adapter container
        uses: docker/build-push-action@v7
        with:
          context: ./functions
          file: ./functions/Dockerfile
          platforms: linux/amd64

  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Worker
        run: dotnet restore worker/Amiasea.Worker.csproj

      - name: Run Worker unit tests
        run: dotnet test worker/Amiasea.Worker.csproj --no-restore

      - name: Build Worker container
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64